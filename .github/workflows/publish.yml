name: Publish to PyPI

# Publishing is triggered by cutting a GitHub Release. Uploads to PyPI are
# irreversible — a version number can be yanked but never reused — so this
# deliberately does NOT fire on every push to main.
#
# Authentication currently uses a PyPI API token held in the PYPI_API_TOKEN repo
# secret. See the note on the publish job for why, and for how to move back to
# Trusted Publishing (OIDC), which stores no credential at all.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only — do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Verify the wheel imports and reports the right version
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import puntersedge
          from puntersedge import PuntersEdge
          c = PuntersEdge(api_key="ci-smoke-test")
          assert hasattr(c, "racing_next_to_go"), "client is missing racing_next_to_go"
          print("import OK, version", puntersedge.__version__)
          PY

      # A release tagged v0.2.0 must ship version 0.2.0. Without this, a
      # forgotten version bump silently republishes — which PyPI rejects — or
      # worse, ships a version whose number doesn't match its tag.
      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject: $PKG   tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Version mismatch — pyproject.toml is $PKG but the release tag is $TAG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Skip the upload on a dry-run manual dispatch; always run for a release.
    if: github.event_name == 'release' || inputs.dry_run == false

    # Add required reviewers to this environment in the repo's
    # Settings → Environments to gate the upload behind an approval.
    environment:
      name: pypi
      url: https://pypi.org/project/puntersedge/

    # NOTE: this used to authenticate with PyPI Trusted Publishing (OIDC), which stores no
    # credential anywhere. It was switched to an API token on 2026-08-21 after three
    # attempts failed with `invalid-publisher: valid token, but no corresponding publisher`
    # — the token was valid and PyPI simply had no publisher matching these claims:
    #
    #     repository_owner  Propertyscout001
    #     repository        Propertyscout001/puntersedge-python
    #     workflow_ref      .../.github/workflows/publish.yml@refs/tags/v0.2.0
    #     environment       pypi
    #
    # To go back to Trusted Publishing once that is configured at
    # pypi.org → the puntersedge project → Manage → Publishing: restore
    #     permissions:
    #       id-token: write
    # and drop the `password:` line from the Publish step. Nothing else changes, and the
    # stored secret can then be deleted. That is the better end state — a stored token is
    # a credential that can leak, and OIDC has none.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Without this, a missing or misnamed secret surfaces as an opaque authentication
      # error from the upload step, which reads exactly like the OIDC failure this change
      # exists to get away from.
      - name: Check the token secret is present
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions. It must start with 'pypi-'."
            exit 1
          fi
          case "$TOKEN" in
            pypi-*) echo "token present, correct prefix" ;;
            *) echo "::error::PYPI_API_TOKEN does not start with 'pypi-' — that is not a PyPI API token."; exit 1 ;;
          esac

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
