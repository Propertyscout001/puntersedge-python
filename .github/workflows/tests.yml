name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful, and these are cheap to restart.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the others. Knowing "3.8 and Windows both fail" is a
      # different problem from "3.8 fails", and fail-fast would report the second.
      fail-fast: false
      matrix:
        include:
          # 3.8 is the floor declared in pyproject.toml. setup-python does not publish a
          # 3.8 build for ubuntu-24.04, which ubuntu-latest now is — so it is pinned to
          # 22.04 rather than dropped. A support claim nothing executes is not a claim.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # config.py and ledger.py both branch on os.name == "nt" — the APPDATA config
          # path, and skipping POSIX mode checks because st_mode there is synthesised from
          # the read-only attribute and never reflects the ACL. No machine in this project
          # runs those branches. Without this job they ship having never executed.
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Install the BUILT package, not the source tree, and run the tests against that.
      # It costs nothing and it means a packaging mistake — a subpackage missing from the
      # wheel, say — fails here rather than on somebody's `pip install`.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Test
        run: python -m pytest tests/ -q

      # Proves the suite is exercising the installed distribution rather than accidentally
      # importing ./src, which would make the whole job a much weaker check than it looks.
      - name: Confirm the tests ran against the installed package
        run: |
          python -c "import puntersedge, pathlib, sys; p = pathlib.Path(puntersedge.__file__).resolve(); print(p); sys.exit(0 if 'site-packages' in p.parts else 1)"

  metadata:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*

      # The version lives in three places and they have drifted before: the client shipped
      # a hardcoded "puntersedge-python/0.1.0" User-Agent inside a 0.2.0 package, so every
      # install misreported itself. publish.yml already fails a release when the git tag
      # and pyproject disagree; this closes the remaining corner.
      - name: Version is consistent
        run: |
          python -m pip install .
          python - <<'PY'
          import configparser, pathlib, re, sys
          import puntersedge

          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          assert match, "no version in pyproject.toml"
          declared, installed = match.group(1), puntersedge.__version__
          print("pyproject:", declared, "| __version__:", installed)
          if declared != installed:
              sys.exit("version mismatch: pyproject %s vs __version__ %s"
                       % (declared, installed))
          PY

      # The arb toolkit is a subpackage. If packages.find is ever narrowed it would vanish
      # from the wheel silently, and the failure would surface as an ImportError for a user
      # rather than as a red build here.
      - name: Wheel contains the arb subpackage
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "puntersedge/__init__.py",
              "puntersedge/config.py",
              "puntersedge/_secret.py",
              "puntersedge/arb/gates.py",
              "puntersedge/arb/scanner.py",
              "puntersedge/arb/sizing.py",
              "puntersedge/arb/ledger.py",
              "puntersedge/arb/alerts.py",
              "puntersedge/arb/cli.py",
          ]
          missing = [name for name in required if name not in names]
          print(wheel, "->", len(names), "entries")
          if missing:
              sys.exit("missing from the wheel: %s" % missing)
          PY

      # The console script is declared in pyproject. If the entry point is wrong, `pip
      # install` succeeds and the command simply does not exist — a failure the library
      # tests cannot see.
      - name: Console script works
        run: |
          puntersedge-arb --help > /dev/null
          puntersedge-arb ledger --ledger "$RUNNER_TEMP/l.jsonl" path
