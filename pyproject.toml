[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puntersedge"
version = "0.2.2"
description = "Official Python client for the PuntersEdge Australian Sports Odds API — live bookmaker odds, racing, best-odds comparison and arbitrage."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PuntersEdge", email = "support@puntersedge.online" }]
keywords = [
    "australian sports odds api",
    "betting api",
    "odds api",
    "odds comparison",
    "arbitrage betting",
    "horse racing odds",
    "sportsbet",
    "betfair",
    "sports betting data",
    "bookmaker odds",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["requests>=2.25"]

[project.scripts]
puntersedge-arb = "puntersedge.arb.cli:main"

[project.urls]
Homepage = "https://puntersedge.online/api-platform"
Documentation = "https://puntersedge.online/developers"
"API Pricing" = "https://puntersedge.online/api/pricing"
Repository = "https://github.com/Propertyscout001/puntersedge-python"
"Get an API key" = "https://puntersedge.online/api-platform#signup"

[tool.setuptools.packages.find]
where = ["src"]
